<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>패파리그 EXAM — 시험 결과</title>
  <link rel="stylesheet" href="css/style.css?v=20260528">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="header-brand">
        <div class="header-logo">P</div>
        <div>
          <h1 class="page-title">패파리그 <span>EXAM</span></h1>
          <p class="page-subtitle">시험 결과</p>
        </div>
      </div>
      <button type="button" onclick="localStorage.removeItem('pafa_student');sessionStorage.removeItem('pafa_student');localStorage.removeItem('pafa_result');sessionStorage.removeItem('pafa_result');location.href='index.html';" style="font-size:11px;padding:4px 10px;border:1px solid #ccc;border-radius:6px;background:transparent;color:#888;cursor:pointer">로그아웃</button>
    </header>

    <section class="card">
      <div class="result-summary">
        <div class="muted" id="result-student"></div>
        <div class="result-label" id="result-title"></div>
        <div class="result-score" id="result-score"></div>
        <div class="muted" id="result-rate-label"></div>
        <div class="progress-track">
          <div class="progress-fill" id="result-progress" style="width: 0%;"></div>
        </div>
        <button type="button" id="copy-wrong-md" style="margin-top:16px;font-size:13px;font-weight:700;padding:8px 16px;border:1px solid var(--navy,#1a3a6b);border-radius:6px;background:transparent;color:var(--navy,#1a3a6b);cursor:pointer;">📋 틀린 문항 복사</button>
      </div>
    </section>

    <section class="card">
      <h2 style="font-size:15px;font-weight:800;color:var(--navy);margin-bottom:16px;">문항별 결과</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>번호</th>
              <th>내 답</th>
              <th>정답</th>
              <th>득점</th>
            </tr>
          </thead>
          <tbody id="result-table-body"></tbody>
        </table>
      </div>
    </section>

    <button type="button" class="btn btn-secondary" id="retry-button">다시 시험보기</button>
  </div>

  <script src="js/api.js?v=20260528"></script>
  <script>
    (function () {
      const storedResult = localStorage.getItem('pafa_result') || sessionStorage.getItem('pafa_result');
      if (!storedResult) { window.location.href = 'index.html'; return; }

      const result = JSON.parse(storedResult);

      function parseExamTitle(raw) {
        if (!raw) return raw;
        return raw
          .replace(/\.json$/i, '')
          .replace(/^패파리그_/, '')
          .replace(/_(최고난도|심화|고난도|기본)/g, '')
          .replace(/_[A-Z0-9]_동형등록$/i, '')
          .replace(/_동형등록$/i, '')
          .replace(/고([123])/, '$1학년')
          .replace(/_/g, ' ')
          .trim();
      }

      function fmtScore(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return '0';
        const rounded = Math.round(n * 10) / 10;
        return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/\.0$/, '');
      }

      function isSubjectiveResponse(item) {
        if (item.question_type === '주관식' || item.type === '주관식') return true;
        const qtype = String(item.qtype || '');
        return !qtype.includes('객관식') && /(서술|주관|영작|단답)/.test(qtype);
      }

      function normalizeBreakdown(raw) {
        const sb = raw.score_breakdown || {};
        const make = (part, scoreKey, maxKey) => ({
          score: Number(part?.score ?? sb[scoreKey] ?? 0) || 0,
          max_score: Number(part?.max_score ?? sb[maxKey] ?? 0) || 0,
          pending_count: Number(part?.pending_count ?? 0) || 0,
        });
        let objective = make(sb.objective, 'objective_score', 'objective_max_score');
        let subjective = make(sb.subjective, 'subjective_score', 'subjective_max_score');
        let total = make(sb.total, 'raw_score', 'raw_max_score');
        subjective.pending_count = Number(sb.subjective_pending_count ?? subjective.pending_count ?? 0) || 0;

        if (!total.max_score && Array.isArray(raw.responses)) {
          objective = { score: 0, max_score: 0, pending_count: 0 };
          subjective = { score: 0, max_score: 0, pending_count: 0 };
          raw.responses.forEach(item => {
            const target = isSubjectiveResponse(item) ? subjective : objective;
            target.score += item.score == null ? 0 : (Number(item.score) || 0);
            target.max_score += Number(item.max_score) || 0;
            if (item.grade_status === 'pending' || item.score == null) target.pending_count += 1;
          });
          total = {
            score: objective.score + subjective.score,
            max_score: objective.max_score + subjective.max_score,
            pending_count: objective.pending_count + subjective.pending_count,
          };
        }
        return { total, objective, subjective };
      }

      function partText(label, part) {
        if (!part || !part.max_score) return '';
        const pending = part.pending_count ? ` · ${part.pending_count}개 채점 중` : '';
        return `${label} ${fmtScore(part.score)}/${fmtScore(part.max_score)}점${pending}`;
      }

      const breakdown = normalizeBreakdown(result);
      const percentage = result.max_score ? Math.round((result.total_score / result.max_score) * 100) : (breakdown.total.max_score ? Math.round(breakdown.total.score / breakdown.total.max_score * 100) : 0);
      const breakdownLabel = [
        partText('객관식', breakdown.objective),
        partText('서술형', breakdown.subjective),
      ].filter(Boolean).join(' · ');

      document.getElementById('result-student').textContent = `${result.student_name || ''} 학생`;
      document.getElementById('result-title').textContent = parseExamTitle(result.exam_title) || '시험';
      const gradingNow = result.writing_status === 'grading';
      document.getElementById('result-score').textContent = breakdown.total.max_score
        ? `${fmtScore(breakdown.total.score)} / ${fmtScore(breakdown.total.max_score)}점`
        : `${percentage} / 100점`;
      document.getElementById('result-rate-label').textContent = gradingNow
        ? `${breakdownLabel || '서술형 채점 중'} · 최종 점수는 채점 완료 후 확정됩니다`
        : (breakdownLabel || `환산 점수 ${percentage}/100점`);
      setTimeout(() => {
        document.getElementById('result-progress').style.width = `${percentage}%`;
      }, 100);

      const escHtml = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      // JSON 형태 정답(어법/어휘) → "① goes  ⑤ go" 표시
      function fmtAnswer(s) {
        if (!s) return '-';
        try {
          const obj = JSON.parse(s);
          if (typeof obj === 'object' && !Array.isArray(obj)) {
            return escHtml(Object.entries(obj).map(([k,v])=>`${k} ${v}`).join('  '));
          }
        } catch(_) {}
        return escHtml(s);
      }
      document.getElementById('result-table-body').innerHTML = (result.responses || [])
        .map((item) => {
          const detailId = `detail-${item.question_no}`;
          // 서술형 채점 대기 — 점수·정답·해설 미공개("채점 중")
          if (item.grade_status === 'pending') {
            return `
            <tr>
              <td>${item.question_no}</td>
              <td>${escHtml(item.answer) || '-'}</td>
              <td style="color:var(--muted,#999)">—</td>
              <td style="color:var(--muted,#999);font-weight:600">✍ 채점 중<span style="font-weight:400">/${item.max_score ?? ''}</span></td>
            </tr>`;
          }
          const wrong = item.score < item.max_score;
          const hasFeedback = item.feedback && item.feedback.trim();
          const hasExplain  = item.explain_text && item.explain_text.trim();
          // 서술형 루브릭 항목별 채점 결과
          const detailList = Array.isArray(item.grade_detail) ? item.grade_detail : [];
          const detailHtml = detailList.length ? `<div style="margin-bottom:6px"><strong style="color:var(--primary,#1a3a6b)">항목별 채점:</strong><br>${detailList.map(d=>`· ${escHtml(d.label)}: ${d.score}/${d.max}${d.reason?` — ${escHtml(d.reason)}`:''}`).join('<br>')}</div>` : '';
          const showExtra = (wrong && (hasFeedback || hasExplain)) || detailList.length > 0;
          const extraRow = showExtra ? `
            <tr id="${detailId}" style="display:none;background:var(--card-bg,#f8f9fb)">
              <td colspan="4" style="padding:10px 14px;font-size:12px;color:var(--text,#333);line-height:1.6;border-top:1px dashed var(--border,#e0e0e0)">
                ${detailHtml}
                ${hasFeedback ? `<div style="margin-bottom:6px"><strong style="color:var(--primary,#1a3a6b)">채점 피드백:</strong> ${escHtml(item.feedback)}</div>` : ''}
                ${hasExplain  ? `<div><strong style="color:var(--primary,#1a3a6b)">해설:</strong><br><span style="white-space:pre-wrap">${escHtml(item.explain_text)}</span></div>` : ''}
              </td>
            </tr>` : '';
          const toggleBtn = showExtra
            ? `<button onclick="var r=document.getElementById('${detailId}');r.style.display=r.style.display==='none'?'table-row':'none'" style="font-size:10px;padding:1px 7px;border:1px solid #ccc;border-radius:4px;background:transparent;cursor:pointer;margin-left:6px">상세</button>`
            : '';
          return `
            <tr>
              <td>${item.question_no}</td>
              <td>${escHtml(item.answer) || '-'}</td>
              <td>${fmtAnswer(item.correct_answer)}</td>
              <td class="${item.score > 0 ? 'score-correct' : 'score-wrong'}">${item.score}<span style="color:var(--muted);font-weight:400">/${item.max_score ?? ''}</span>${toggleBtn}</td>
            </tr>${extraRow}`;
        })
        .join('');

      // 틀린 문항 → 출처·유형 마크다운 복사
      function buildWrongMarkdown() {
        const cleanSource = s => s ? String(s).replace(/\s*-\s*특수$/i, '').trim() : '출처 미상';
        const all = result.responses || [];
        const wrong = all.filter(r => r.grade_status !== 'pending' && Number(r.score) < Number(r.max_score));
        const pending = all.filter(r => r.grade_status === 'pending').length;
        const correct = all.filter(r => r.grade_status !== 'pending' && r.score != null && Number(r.score) >= Number(r.max_score)).length;
        const title = parseExamTitle(result.exam_title) || '시험';
        let out = `${title} — 틀린 문항 (${result.student_name || ''})\n`;
        out += `총 ${all.length}문제 중 ${correct}개 맞음\n\n`;
        if (!wrong.length) out += '틀린 문항이 없습니다.';
        else out += wrong.map(r => `${cleanSource(r.source)} ${(r.qtype || r.question_type || '').trim()}`.trim()).join('\n');
        if (pending) out += `\n\n(서술형 ${pending}개 채점 중)`;
        return out;
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
        } catch(_) {}
        // http/구형 폴백
        try {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
        } catch(_) { return false; }
      }

      document.getElementById('copy-wrong-md').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const ok = await copyText(buildWrongMarkdown());
        const prev = btn.textContent;
        btn.textContent = ok ? '✓ 복사됨' : '복사 실패';
        setTimeout(() => { btn.textContent = prev; }, 1500);
      });

      document.getElementById('retry-button').addEventListener('click', () => {
        window.location.href = 'exam.html';
      });
    })();
  </script>
<script>
(function(){
  const DEV_HOSTS = ['localhost','127.0.0.1','106.250.201.250',''];
  const isDebug = new URLSearchParams(location.search).get('debug') === '7958';
  if (DEV_HOSTS.includes(location.hostname) || isDebug || location.protocol === 'file:') return;
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12') { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); return false; }
    if (e.ctrlKey && ['u','U','s','S'].includes(e.key)) { e.preventDefault(); return false; }
  }, true);
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; }, true);
  let _dtOpen = false;
  setInterval(function() {
    const w = window.outerWidth - window.innerWidth > 160;
    const h = window.outerHeight - window.innerHeight > 160;
    if (w || h) { if (!_dtOpen) { _dtOpen = true; console.clear(); } } else { _dtOpen = false; }
  }, 1000);
  if (new URLSearchParams(location.search).get('debug') !== '7958') { console.log = () => {}; console.warn = () => {}; }
  document.addEventListener('dragstart', function(e) { e.preventDefault(); });
})();
</script>
</body>
</html>
