<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>패파리그 — 1등급 측정기</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .trk-banner{background:linear-gradient(135deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;border-radius:12px;padding:16px 18px;margin-bottom:16px}
    .trk-dday{font-size:13px;color:var(--gold3);font-weight:700}
    .trk-msg{font-size:14px;margin-top:6px;line-height:1.5}
    .trk-overall{display:flex;align-items:center;gap:10px;margin-top:10px}
    .trk-overall .bar{flex:1;height:10px;background:rgba(255,255,255,.18);border-radius:5px;overflow:hidden}
    .trk-overall .bar>div{height:100%;background:linear-gradient(90deg,var(--gold) 0%,var(--gold2) 100%)}
    .psg-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--white);cursor:pointer;transition:.15s}
    .psg-card:hover{border-color:var(--gold)}
    .psg-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .psg-no{font-weight:800;color:var(--navy)}
    .psg-meta{font-size:11px;color:var(--muted);margin-top:3px}
    .psg-pct{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
    .psg-form{margin-top:14px;border-top:1px dashed var(--border);padding-top:14px;display:none}
    .psg-form.open{display:block}
    .sl-row{display:flex;align-items:center;gap:10px;margin:8px 0}
    .sl-row label{width:48px;font-size:13px;color:var(--text);font-weight:600}
    .sl-row input[type=range]{flex:1}
    .sl-row .val{width:40px;text-align:right;font-size:12px;color:var(--muted)}
    .wk-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .wk-chip{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:8px;padding:3px 6px;font-size:11px;background:var(--bg)}
    .wk-chip button{width:20px;height:20px;border:none;border-radius:5px;background:var(--navy);color:#fff;font-size:13px;cursor:pointer;line-height:1}
    .wk-chip .c{min-width:14px;text-align:center;font-weight:700}
    .wk-chip.has{border-color:var(--danger)}
    .trk-check{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}
    .trk-actions{display:flex;gap:8px;margin-top:12px}
    .subtitle-sm{font-size:11px;color:var(--muted);margin:10px 0 4px}
  </style>
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="header-brand">
        <div class="header-logo">P</div>
        <div>
          <h1 class="page-title">1등급 <span>측정기</span></h1>
          <p class="page-subtitle" id="student-label"></p>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <a href="exam.html" style="font-size:11px;padding:6px 10px;border:1px solid #ccc;border-radius:6px;background:transparent;color:#888">시험 응시</a>
        <button type="button" onclick="if(confirm('로그아웃하시겠습니까?')){localStorage.removeItem('pafa_student');sessionStorage.removeItem('pafa_student');location.href='index.html';}" style="font-size:11px;padding:6px 10px;border:1px solid #ccc;border-radius:6px;background:transparent;color:#888;cursor:pointer">로그아웃</button>
      </div>
    </header>

    <div id="trk-banner-wrap"></div>
    <section class="card">
      <div id="trk-body"><div class="status-banner">시험범위를 불러오는 중입니다.</div></div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/tracker.js"></script>
</body>
</html>
